function homePage(){return `${head('نمای کلی سامانه','وضعیت فرایندهای ثبت‌شده و برنامه‌های در جریان · داده‌های نمایشی',`<button class="btn" onclick="go('reports')">گزارش مدیریتی</button><button class="btn primary" onclick="go('plan')">مشاهدهٔ برنامهٔ هفتگی</button>`)}<div class="grid stats"><div class="card stat"><div><span>روترهای فعال در پروژه‌ها</span><strong>${fa(routers.length)}</strong></div><em>۴ پروژه</em></div><div class="card stat"><div><span>آمادهٔ Cutover</span><strong>${fa(routers.filter(r=>r.status==='آمادهٔ اجرا'||r.status==='آماده با شرط').length)}</strong></div><em>از ${fa(routers.length)} روتر</em></div><div class="card stat"><div><span>در انتظار اقدام عملیات</span><strong>${fa(tasks.length)}</strong></div><em class="warn">صف مشترک</em></div><div class="card stat"><div><span>یادآوری فعال</span><strong>${fa(reminders.length)}</strong></div><em class="warn">نیازمند پیگیری</em></div></div><div class="grid dashboard-grid">${card('پیشرفت روترها در مراحل اجرا',`<div class="chart">${[['QA',130,48,20],['TEMP',95,57,32],['ATP',80,66,38],['Cutover',60,47,35],['Handover',35,26,16]].map(x=>`<div class="bar-group"><div class="bars"><i class="bar" style="height:${x[1]}px"></i><i class="bar alt" style="height:${x[2]}px"></i><i class="bar gray" style="height:${x[3]}px"></i></div><label>${x[0]}</label></div>`).join('')}</div><div class="legend"><span><i></i>تأیید/موفق</span><span><i class="l2"></i>در جریان</span><span><i class="l3"></i>منتظر اقدام</span></div>`,'<small>تجمیع کل پروژه‌ها</small>')}${card('پیشرفت به تفکیک استان',`<div class="progress-list">${[['تهران',72],['اصفهان',54],['گیلان',66],['یزد',83]].map(x=>`<div class="progress-row"><label>${x[0]}</label><div class="track"><i style="width:${x[1]}%"></i></div><b>${fa(x[1])}٪</b></div>`).join('')}</div>`,'<small>درصد روترهای به‌نتیجه‌رسیده</small>')}</div><div class="grid section-grid">${card('اقدام‌های نیازمند توجه',reminders.slice(0,3).map(x=>`<div class="alert-row"><i class="alert-dot ${x.level}"></i><div><div class="alert-title">${x.title}</div><div class="alert-meta">${x.detail}</div></div><span class="print">${x.when}</span></div>`).join(''),'<button class="btn ghost small" onclick="go(\'reminders\')">همهٔ یادآوری‌ها</button>')}${card('توزیع کار نفرات عملیات',people.slice(0,4).map((p,i)=>`<div class="progress-row" style="grid-template-columns:90px 1fr 70px;margin:9px 0"><label>${p}</label><div class="track"><i style="width:${[65,48,79,39][i]}%"></i></div><b>${fa([8,6,11,4][i])} کار</b></div>`).join(''),'<button class="btn ghost small" onclick="go(\'reports\')">مشاهدهٔ داشبورد</button>')}</div>`}
function minePage(){let name=role==='operator'?'علی رضایی':role==='project'?'لیلا احمدی':role==='operations'?'مهدی کریمی':'مریم صالحی';return `${head('کارهای من',`نمای شخصی ${name} · کارهای جاری، تکمیل‌شده، منتظر و واگذارشده`)}<div class="grid stats"><div class="card stat"><div><span>در حال انجام</span><strong>${fa(3)}</strong></div><em>جاری</em></div><div class="card stat"><div><span>منتظر اقدام دیگران</span><strong>${fa(2)}</strong></div><em class="warn">وابستگی</em></div><div class="card stat"><div><span>تکمیل‌شده این ماه</span><strong>${fa(18)}</strong></div><em>ماه جاری</em></div><div class="card stat"><div><span>برنامهٔ پیش‌رو</span><strong>${fa(2)}</strong></div><em>این هفته</em></div></div>${card('کارهای جاری و نزدیک',`<div class="tabs"><button class="active">همه</button><button>در حال انجام</button><button>منتظر</button><button>برگشتی</button><button>تکمیل‌شده</button></div>${tasks.slice(0,4).map(t=>`<div class="task-row"><div><div class="task-title"><span class="ltr">${t.router}</span> · ${t.title}</div><div class="task-sub">مرحلهٔ ${t.stage} · ${t.age} پیش</div></div><div>${badge(t.state)}</div><div class="task-actions"><button class="btn small" onclick="toast('جزئیات وظیفه در نمای کامل سامانه باز می‌شود')">جزئیات</button><button class="btn primary small" onclick="toast('اقدام نمایشی ثبت شد')">${t.state==='در حال انجام'?'ادامهٔ کار':'اقدام'}</button></div></div>`).join('')}`,'<small>مسئولیت هر کار بر اساس ارجاع همان مرحله</small>')}</div>`}
function planPage(){return `${head('برنامهٔ هفتگی Cutover','طرح توسعه تهران · هفتهٔ ۱۸ تا ۲۴ مهر ۱۴۰۵ · لیدر راه‌اندازی برنامه را می‌چیند',`<button class="btn" onclick="toast('نسخهٔ نمایشی: برنامه ذخیره شد')">ذخیرهٔ تغییرات</button><button class="btn primary" onclick="publishPlan()">انتشار برنامه</button>`)}<div class="plan-note"><b>مسئول اجرای Cutover:</b> لیدر راه‌اندازی برای هر روتر در برنامه یک نفر تعیین می‌کند؛ انتشار تا تعیین همهٔ مسئولان برنامه مسدود است. این مسئولیت مختص Cutover است و مسئول QA، TEMP، ATP و Handover جداگانه ارجاع می‌شود. عملیات می‌تواند هنگام اجرا شخص دیگری را به‌عنوان مجری واقعی ثبت کند؛ هر دو نام در سابقه می‌مانند.</div><div class="split" style="margin-bottom:13px"><div class="week-nav"><button class="btn small" onclick="toast('هفتهٔ قبل')">هفتهٔ قبل</button><strong>شنبه ۱۸ مهر — جمعه ۲۴ مهر ۱۴۰۵</strong><button class="btn small" onclick="toast('هفتهٔ بعد')">هفتهٔ بعد</button></div><div class="filters"><input id="planSearch" placeholder="جست‌وجوی نام روتر یا سایت"><select id="planProvince"><option value="">همهٔ استان‌ها</option><option>تهران</option><option>اصفهان</option><option>گیلان</option><option>یزد</option></select><button class="btn" onclick="toast('افزودن روتر از محدودهٔ پروژه')">＋ افزودن روتر</button></div></div><div class="card table-card"><div class="table-wrap"><table><thead><tr><th>روتر</th><th>استان / پروژه</th><th>Topology</th><th>QA</th><th>TEMP</th><th>ATP</th><th>زمان برنامه</th><th>مسئول اجرای Cutover</th><th>وضعیت آمادگی</th><th></th></tr></thead><tbody id="planRows">${routers.map(r=>`<tr data-prov="${r.province}" data-search="${r.name} ${r.site} ${r.project}"><td><button class="btn ghost small" onclick="detail('${r.id}')"><b class="ltr">${r.name}</b></button></td><td>${r.province}<br><small class="muted">${r.project}</small></td><td><span class="badge">${r.topology}</span></td><td>${badge(r.qa)}</td><td>${badge(r.temp)}</td><td>${badge(r.atp)}<br><small class="muted">اعتبار تا ${r.expires}</small></td><td>${r.day}<br><small>${r.time}</small></td><td>${assigneeControl(r)}</td><td>${badge(r.status)}</td><td><button class="icon-btn" onclick="detail('${r.id}')">جزئیات</button></td></tr>`).join('')}</tbody></table></div></div><p class="print">انتساب مسئول برنامه با مسئول عملیات مراحل دیگر مستقل است. در تغییر مجری هنگام اجرا، نام مجری واقعی به رویداد اجرای Cutover اضافه می‌شود.</p>`}
function queuePage(){let list=tasks.filter(t=>queueFilter==='همه'||t.stage===queueFilter);return `${head('صف عملیات','درخواست‌های ثبت‌شده از تیم پروژه برای بررسی، Claim و ثبت نتیجه') }<div class="tabs">${['همه','QA','TEMP','ATP','Handover'].map(x=>`<button class="${queueFilter===x?'active':''}" onclick="queueFilter='${x}';render()">${x==='همه'?'همهٔ مراحل':x}</button>`).join('')}</div>${card('درخواست‌های قابل اقدام',list.map(t=>`<div class="task-row"><div><div class="task-title"><span class="ltr">${t.router}</span> · ${t.title}</div><div class="task-sub">${t.stage} · ارجاع فعلی: ${t.owner} · ثبت ${t.age} پیش</div></div><div>${badge(t.state)}</div><div class="task-actions"><button class="btn small" onclick="toast('جزئیات درخواست باز شد')">جزئیات</button><button class="btn primary small" onclick="claimTask('${t.router}')">Claim / بررسی</button></div></div>`).join('')||'<div class="empty">در این مرحله درخواستی وجود ندارد.</div>')}<div class="callout" style="margin-top:14px"><b>تفکیک مسئولیت:</b> تعیین مجری Cutover در برنامهٔ هفتگی، مسئولیت لیدر راه‌اندازی است. ارجاع و Claim درخواست‌های QA، TEMP، ATP و Handover مستقل از آن و در صف عملیات انجام می‌شود. نتیجهٔ واقعی اجرا نیز توسط عملیات ثبت می‌شود.</div>`}
function routersPage(){return `${head('روترها و پروژه‌ها','فهرست روترهای ثبت‌شده در محدودهٔ پروژه‌های مجاز',`<button class="btn primary" onclick="toast('فرم ثبت آیتم پروژه باز شد')">＋ ثبت روتر / آیتم</button>`)}<div class="split" style="margin-bottom:12px"><div class="filters"><input id="routerSearch" placeholder="نام روتر، کد سایت یا پروژه"><select id="routerProvince"><option value="">همهٔ استان‌ها</option><option>تهران</option><option>اصفهان</option><option>گیلان</option><option>یزد</option></select><select><option>همهٔ مراحل</option><option>QA</option><option>TEMP</option><option>ATP</option><option>Cutover</option><option>Handover</option></select></div><span class="muted">${fa(routers.length)} روتر</span></div><div class="card table-card"><div class="table-wrap"><table><thead><tr><th>نام روتر</th><th>استان</th><th>پروژه</th><th>QA</th><th>TEMP</th><th>ATP</th><th>برنامه</th><th>مسئول Cutover</th><th>وضعیت کلی</th></tr></thead><tbody id="routerRows">${tableRows()}</tbody></table></div></div>`}
function remindersPage(){return `${head('یادآوری‌های مدیریتی','فهرست تجمیعی قابل فیلتر برای اقدام‌های باز · مشاهدهٔ اعلان آن را رفع‌شده نمی‌کند',`<button class="btn" onclick="toast('فهرست خروجی آماده شد')">خروجی گزارش</button>`)}<div class="split" style="margin-bottom:12px"><div class="filters"><select><option>همهٔ یادآوری‌ها</option><option>برای من</option><option>برای لیدرها</option></select><select><option>همهٔ استان‌ها</option><option>تهران</option><option>اصفهان</option></select><select><option>همهٔ وضعیت‌ها</option><option>فوری</option><option>در انتظار</option><option>رفع‌شده</option></select></div><span class="muted">فعال: ${fa(reminders.length)} · سابقه: ${fa(12)}</span></div>${card('موارد باز',reminders.map((r,i)=>`<div class="alert-row"><i class="alert-dot ${r.level}"></i><div><div class="alert-title">${r.title}</div><div class="alert-meta">${r.detail} · گیرندگان: ${r.who} · ${r.when}</div></div><button class="btn small" onclick="resolveReminder(${i})">اقدام انجام شد</button></div>`).join(''))}<p class="print">رفع یادآوری با انجام اقدام مورد انتظار انجام می‌شود و سابقه حفظ خواهد شد.</p>`}
function reportsPage(){return `${head('گزارش‌های مدیریتی','گزارش‌ها بر اساس رخدادهای ثبت‌شده در سامانه ساخته می‌شوند؛ پایش زندهٔ شبکه در دامنه نیست',`<button class="btn" onclick="window.print()">چاپ / PDF</button><button class="btn primary" onclick="toast('گزارش CSV نمایشی آماده شد')">دریافت خروجی</button>`)}<div class="grid metric-grid"><div class="card metric-card"><span>نرخ تکمیل پروژه‌ها</span><strong>٪۶۸</strong><small>↑ ۶٪ نسبت به دورهٔ قبل</small></div><div class="card metric-card"><span>میانگین زمان رسیدگی QA</span><strong>۱٫۸ روز</strong><small>مبنای محاسبه: زمان ثبت‌شده</small></div><div class="card metric-card"><span>کارهای تکمیل‌شده این ماه</span><strong>۱۲۴</strong><small>تجمیع مراحل پروژه و عملیات</small></div></div><div class="grid dashboard-grid" style="margin-top:15px">${card('پیشرفت پروژه به تفکیک استان',`<div class="table-wrap"><table><thead><tr><th>استان</th><th>کل روتر</th><th>QA</th><th>TEMP</th><th>ATP</th><th>Cutover</th><th>Handover</th><th>پیشرفت</th></tr></thead><tbody>${[['تهران',32,30,26,22,17,12,72],['اصفهان',24,22,18,15,11,8,54],['گیلان',18,16,14,12,10,7,66],['یزد',12,11,10,9,8,6,83]].map(r=>`<tr>${r.map((v,i)=>`<td>${i===0?v:fa(v)+(i===7?'٪':'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,'<small>اطلاعات نمونه</small>')}${card('داشبورد حجم کار نفرات',`<div class="table-wrap"><table><thead><tr><th>کارشناس</th><th>درحال انجام</th><th>منتظر اقدام</th><th>تکمیل‌شده</th><th>بازگشت اصلاح</th><th>میانهٔ زمان</th></tr></thead><tbody>${people.map((p,i)=>`<tr><td><span class="assignee"><span class="mini-avatar">${p[0]}</span>${p}</span></td><td>${fa([3,2,4,1,2][i])}</td><td>${fa([2,3,1,2,1][i])}</td><td>${fa([18,15,21,12,17][i])}</td><td>${fa([1,2,0,3,1][i])}</td><td>${['۱٫۴','۱٫۸','۱٫۲','۲٫۱','۱٫۶'][i]} روز</td></tr>`).join('')}</tbody></table></div>`,'<small>کارهای مراحل دیگر جدا از Cutover</small>')}</div><div class="callout" style="margin-top:14px">انتساب عملکرد بر اساس فردی است که هر اقدام را واقعاً انجام داده؛ برنامه‌ریزی Cutover به‌تنهایی معادل انجام کار یا شاخص بهره‌وری نیست. نفر تعیین‌شده در برنامه و مجری واقعی عملیات هر دو در سابقه نگهداری می‌شوند.</div>`}
function settingsPage(){return `${head('تنظیمات سامانه','تنظیمات فرایندی و سیاست‌های مدیریتی · تغییرات این صفحه در دموی محلی ذخیره نمی‌شوند')}<div class="grid section-grid">${card('قواعد زمان‌بندی فرایندها',`<div class="setting-row"><div><strong>حداقل فاصلهٔ بین مراحل</strong><small>سیاست سراسری توسط مدیر / لیدر عملیات</small></div><select class="role-select"><option>ارسال زودهنگام مجاز؛ Claim مسدود</option><option>ثبت درخواست تا موعد مسدود</option><option>بدون فاصلهٔ اجباری</option></select></div><div class="setting-row"><div><strong>فاصلهٔ Handover پس از Cutover موفق</strong><small>ساعت پیوسته، شامل تعطیلات</small></div><input class="role-select" value="۴۸ ساعت"></div><div class="setting-row"><div><strong>اعتبار ATP</strong><small>پس از پایان اعتبار، تأیید مجدد لازم است</small></div><input class="role-select" value="۷ روز"></div><div class="setting-row"><div><strong>مهلت هشدار پیش از Cutover</strong><small>برای TEMP / ATP ناقص یا نامعتبر</small></div><input class="role-select" value="۲۴ ساعت"></div><div class="setting-row"><div><strong>ایجاد درخواست Handover</strong><small>مدیر سامانه می‌تواند ثبت درخواست را کنترل کند</small></div><select class="role-select"><option>فعال</option><option>غیرفعال</option></select></div>`)}${card('نقش‌ها و دامنهٔ دسترسی',`<div class="setting-row"><div><strong>مدیر سامانه</strong><small>مدیریت کاربران و تنظیمات عمومی</small></div>${badge('مستقل از مدیر عملیات')}</div><div class="setting-row"><div><strong>لیدر عملیات</strong><small>دید سراسری پروژه‌ها و گزارش‌ها؛ مدیریت صف و قواعد عملیات</small></div>${badge('دید سراسری')}</div><div class="setting-row"><div><strong>لیدر پروژه</strong><small>پروژه‌های واگذارشده و مدیریت آمادگی/برنامهٔ پروژه</small></div>${badge('محدود به پروژه')}</div><div class="setting-row"><div><strong>لیدر راه‌اندازی</strong><small>ساخت برنامهٔ هفتگی و تعیین مجری Cutover هر روتر</small></div>${badge('برنامه‌ریزی Cutover')}</div><div class="setting-row"><div><strong>کارشناس عملیات</strong><small>Claim و انجام وظایف ارجاع‌شده در صف هر مرحله</small></div>${badge('وظایف ارجاع‌شده')}</div>`)}${card('قواعد رنج IP و استان',`<div class="setting-row"><div><strong>اعتبارسنجی OM IP در استان</strong><small>IP خارج از رنج مجاز استان از ثبت Temperature بازمی‌ماند</small></div>${badge('الزامی')}</div><div class="setting-row"><div><strong>مالکیت رنج</strong><small>هر رنج به یک گروه RSG A/B متصل و یکتا است</small></div>${badge('تأیید مدیر عملیات')}</div><div class="setting-row"><div><strong>سوابق تغییر تنظیمات</strong><small>تغییرات قواعد و زمان‌ها با اثر بر درخواست‌های انتظار</small></div><button class="btn small" onclick="toast('تاریخچهٔ تغییرات نمایشی')">نمایش سابقه</button></div>`)}${card('دربارهٔ این نمونه',`<p class="muted" style="font-size:11px;line-height:2;margin:0">این صفحه یک نمونهٔ تعاملی برای بررسی ارائه است و به پایگاه داده یا شبکه متصل نیست. اعداد و نام‌ها ساختگی‌اند. رفتارهای نهایی باید مطابق نقش‌ها، قواعد فرایندی و طرح فنی تأییدشده پیاده‌سازی شوند.</p>`)}</div>`}
function detail(id){let r=routers.find(x=>x.id===id);if(!r)return;showModal(`جزئیات روتر <span class="ltr">${r.name}</span>`,`<div class="info-grid"><div class="info-item"><label>استان / مرکز</label><b>${r.province} / ${r.site}</b></div><div class="info-item"><label>توپولوژی</label><b>${r.topology}</b></div><div class="info-item"><label>پروژه</label><b>${r.project}</b></div><div class="info-item"><label>برنامهٔ Cutover</label><b>${r.day} · ${r.time}</b></div><div class="info-item"><label>مسئول برنامه‌ریزی‌شدهٔ Cutover</label><b>${r.cutoverOwner}</b></div><div class="info-item"><label>مسئول مرحلهٔ جاری</label><b>${r.stageOwner}</b></div></div><hr style="border:0;border-top:1px solid var(--line);width:100%"><div class="stage-list">${[['QA',r.qa,'ثبت و بررسی درخواست QA'],['TEMP',r.temp,'پایش و تأیید دما'],['ATP',r.atp,'اعتبار تا '+r.expires],['Cutover',r.status,'مسئول برنامه: '+r.cutoverOwner+' · مجری واقعی: '+(r.actualExecutor||'هنوز ثبت نشده')],['Handover','در انتظار','مسئول ارجاع مرحلهٔ عملیات']].map(x=>`<div class="stage"><b>${x[0]}</b><div>${badge(x[1])}</div><small>${x[2]}</small></div>`).join('')}</div><div class="callout">مسئول برنامه‌ریزی‌شده را لیدر راه‌اندازی تعیین می‌کند. در صورت اجرای Cutover توسط فرد دیگری، عملیات مجری واقعی را در سابقه ثبت می‌کند. مسئول مرحله‌های دیگر از صف مستقل عملیات تعیین می‌شود.</div>${['operations','operator'].includes(role)?`<button class="btn" onclick="openActualExecutor('${r.id}')">ثبت مجری واقعی Cutover</button>`:''}`)}
function openActualExecutor(id){let r=routers.find(x=>x.id===id);showModal('ثبت مجری واقعی Cutover',`<p class="muted" style="margin:0">مسئول برنامه: <b>${r.cutoverOwner}</b>. این انتخاب نام فردی را ثبت می‌کند که واقعاً اجرا را انجام می‌دهد.</p><div class="field"><label>مجری واقعی</label><select id="actualChoice">${people.map(p=>`<option ${r.actualExecutor===p?'selected':''}>${p}</option>`).join('')}</select></div>`);document.querySelector('.modal-foot').innerHTML=`<button class="btn" onclick="closeModal()">لغو</button><button class="btn primary" onclick="saveActualExecutor('${id}')">ثبت در سابقه</button>`}
function saveActualExecutor(id){let r=routers.find(x=>x.id===id);r.actualExecutor=document.getElementById('actualChoice').value;closeModal();toast(`مجری واقعی ${r.actualExecutor} ثبت شد؛ مسئول برنامه ${r.cutoverOwner} حفظ شد`);detail(id)}
function showModal(title,body){let m=document.getElementById('modal');m.innerHTML=`<div class="modal"><div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn" onclick="closeModal()">بستن</button><button class="btn primary" onclick="toast('اقدام نمایشی ثبت شد');closeModal()">ثبت اقدام نمایشی</button></div></div>`;m.classList.add('open');m.onclick=e=>{if(e.target===m)closeModal()}}
function closeModal(){document.getElementById('modal').classList.remove('open')}
let toastTimer;function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
function setCutoverOwner(id,p){if(role!=='commissioning'){toast('تعیین مسئول برنامه فقط برای لیدر راه‌اندازی فعال است');render();return}let r=routers.find(x=>x.id===id);r.cutoverOwner=p;toast(`مسئول Cutover ${r.name} به ${p} تغییر کرد`);render()}
function publishPlan(){let missing=routers.filter(r=>r.cutoverOwner==='تعیین نشده');if(missing.length){toast(`انتشار متوقف شد: برای ${fa(missing.length)} روتر مسئول Cutover تعیین نشده`);return}toast('برنامهٔ هفتگی منتشر شد')}
function claimTask(router){let t=tasks.find(x=>x.router===router);t.state='در حال انجام';t.owner='علی رضایی';toast('درخواست Claim شد؛ بازبینی ادامه دارد');render()}
function resolveReminder(i){reminders.splice(i,1);toast('اقدام انجام‌شده ثبت شد؛ سابقهٔ یادآوری حفظ می‌شود');render()}
function wire(){let s=document.getElementById('planSearch');if(s)s.oninput=filterPlan;let p=document.getElementById('planProvince');if(p)p.onchange=filterPlan;let rs=document.getElementById('routerSearch');if(rs)rs.oninput=filterRouters;let rp=document.getElementById('routerProvince');if(rp)rp.onchange=filterRouters;document.querySelectorAll('.tabs button').forEach(b=>{if(!b.onclick)b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}})}
function filterPlan(){let q=document.getElementById('planSearch').value.toLowerCase(),p=document.getElementById('planProvince').value;document.querySelectorAll('#planRows tr').forEach(r=>r.classList.toggle('hidden',!(r.dataset.search.toLowerCase().includes(q)&&(!p||r.dataset.prov===p))))}
function filterRouters(){let q=document.getElementById('routerSearch').value.toLowerCase(),p=document.getElementById('routerProvince').value;let a=routers.filter(r=>(`${r.name} ${r.site} ${r.project}`.toLowerCase().includes(q))&&(!p||r.province===p));document.getElementById('routerRows').innerHTML=tableRows(a)}
document.getElementById('roleSelect').onchange=e=>{role=e.target.value;let labels={commissioning:'م',operations:'م',project:'ل',operator:'ع'};document.getElementById('userAvatar').textContent=labels[role];toast('نقش نمایشی تغییر کرد؛ محدودهٔ دسترسی نمونه به‌روزرسانی شد')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
nav();render();
</script></body></html>
